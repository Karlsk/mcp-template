# Run: docker compose -f deploy/docker-compose.yml up --build
# Secrets are read from a .env file next to the project root (never committed).

services:
  sdn-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sdn-mcp:latest
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      MCP_LOG_LEVEL: "${MCP_LOG_LEVEL:-INFO}"
      # SDN controller connection injected from host environment / .env (never baked in).
      SDN_CONTROLLER_BASE_URL: "${SDN_CONTROLLER_BASE_URL:-}"
      SDN_CONTROLLER_USERNAME: "${SDN_CONTROLLER_USERNAME:-}"
      SDN_CONTROLLER_PASSWORD: "${SDN_CONTROLLER_PASSWORD:-}"
      SDN_CONTROLLER_TOKEN: "${SDN_CONTROLLER_TOKEN:-}"
      # SOP graph (Neo4j) connection — same secret policy as above.
      NEO4J_URI: "${NEO4J_URI:-}"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-}"
      SDN_CONFIG_FILE: "/app/config/sdn_controller.yaml"
    volumes:
      # Override config without rebuilding the image.
      - ../config:/app/config:ro
    restart: unless-stopped
