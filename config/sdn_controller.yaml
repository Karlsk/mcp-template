# SDN controller API configuration (NON-SECRET).
# Secrets (passwords/tokens) are loaded from environment / .env (SDN_CONTROLLER_*),
# never here. base_url comes from SDN_CONTROLLER_BASE_URL (env); leave it empty below.

sdn:
  base_url: ""              # overridden by SDN_CONTROLLER_BASE_URL at runtime
  # no-auth | bearer (固定 api-key via SDN_CONTROLLER_TOKEN) | basic (POST {username,password,device_id} 登录换 token，401 自动刷新)
  auth_type: "basic"
  timeout: 30.0
  ssl_verify: false         # the controller serves a self-signed certificate
  retry:
    max_retries: 3
    base_delay: 1.0
    max_delay: 30.0
  # Named controller endpoints. Add business endpoints as the controller requires.
  endpoints:
    health: "/"
    login: "/oauth/token"   # auth_type=basic: POST {username,password,device_id} to obtain/refresh the token
    alerts: "/monitor/v2/alert/page"                                                       # §3.5 paged alerts (query_alert_page)
    devices_page: "/api/no/config/terra-pe:peInfos/page"                                   # §2.2 paged devices (query_devices)
    links_page: "/api/sr/config/network-topology:network-topology/topology/linksInfo/page"  # §2.16 paged links (query_links)
    topology: "/api/sr/config/network-topology:network-topology"                           # §3.7 full topology (get_topology)
    perf_switch_history: "/monitor/switch/history"   # §3.2 port/link performance (query_switch_history)
    perf_vpn_history: "/monitor/vpn/history"         # §3.3 VPN performance (query_vpn_history)
    perf_te_history: "/monitor/te/history"           # §3.4 TE tunnel performance (query_te_history)
    operation_logs: "/monitor/logs"                  # §3.12 paged operation logs (query_operation_logs)
    command_result: "/api/no/config/device-conf/command-result"   # run device CLI command (run_command)
    bgp_nbr: "/api/no/config/device-conf/bgp-nbr"                  # BGP peer info, GET with device_name/peer_ip query (get_bgp_nbr)
    isis_nbr: "/api/sr/config/network-topology:network-topology/topology/isisNbr"  # ISIS peer of one interface, POST device_name/interface_name (get_isis_nbr)
    interface_name: "/api/no/config/device-conf/interface-name"   # ifIndex -> interface name, GET device_name/interface_idx (get_interface_name)
  # auth_type=basic only: JSON key holding the bearer token in the login response.
  token_field: "access_token"
  # Opt-in request/response body logging for SDN troubleshooting (DEBUG level,
  # redacted + truncated). Error-response bodies are logged at WARNING regardless.
  http_log_bodies: false

# SOP graph database (NON-SECRET). Credentials come from env/.env
# (NEO4J_USERNAME / NEO4J_PASSWORD), never here. uri comes from NEO4J_URI (env);
# leave it empty below. Empty uri = skeleton mode (graph tools return configured:false).
neo4j:
  uri: ""                        # overridden by NEO4J_URI at runtime, e.g. bolt://127.0.0.1:7687
  database: "neo4j"              # PHYSICAL database; community edition has exactly one.
                                 # Logical databases are the node `_db` property, passed
                                 # per query by the graph layer (never configured here).
  query_timeout: 30.0
  max_transaction_retry_time: 15.0
  log_params: false              # DEBUG only: log query parameters
